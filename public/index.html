<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a1f3a">
<title>Carlito Soccer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #1a1f3a; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  body { display: flex; align-items: center; justify-content: center; font-family: 'Luckiest Guy', Impact, sans-serif; }
  canvas { display: block; width: min(100vw, 177.78dvh); aspect-ratio: 16 / 9; }
  #turn { display: none; position: fixed; inset: 0; background: #1a1f3a; color: #ffd93d; font-size: 28px; text-align: center; align-items: center; justify-content: center; padding: 24px; -webkit-text-stroke: 1px #000; }
  @media (orientation: portrait) and (pointer: coarse) { #turn { display: flex; } }
</style>
</head>
<body>
<canvas id="c" width="960" height="540"></canvas>
<div id="turn">📱↻<br>Tourne ton téléphone<br>pour jouer à deux !</div>
<script>
'use strict';
// ================= réglages =================
const W = 960, H = 540, GROUND = 470;
const R = 40;                    // rayon (physique) de la tête
const FOOT_R = 13;               // rayon de la chaussure
const REST_Y = GROUND - R - 31;  // y de la tête quand le joueur est au sol
const SPEED = 5.2, JUMP = -14.5, GRAV = 0.8;
const BALL_R = 15, BALL_GRAV = 0.4, BALL_MAX = 21;
const GOAL_W = 78, BAR_Y = GROUND - 175, BAR_H = 10;
const KICK_LEN = 16, KICK_POWER = 17;
const MATCH_TIME = 60;           // secondes
const OUTLINE = '#1b1b2f';
const DEBUG = new URLSearchParams(location.search).has('debug');

// Pour renommer un personnage, change son nom ici.
const HEADS = [
  { src: 'heads/p1.png', name: 'Carlito' },
  { src: 'heads/p2.png', name: 'Moustache' },
  { src: 'heads/p3.png', name: 'Nono' },
  { src: 'heads/p4.png', name: 'Le Boss' },
  { src: 'heads/p5.png', name: 'Éclipse' },
];
// Chaque tête détourée reçoit un contour noir cartoon qui suit sa silhouette (calculé une fois au chargement).
const SPRITE_H = 360, SPRITE_O = 13;
function makeSprite(img) {
  const h = SPRITE_H, w = Math.round(h * img.naturalWidth / img.naturalHeight), o = SPRITE_O;
  const c = document.createElement('canvas'); c.width = w + 2 * o; c.height = h + 2 * o;
  const g = c.getContext('2d');
  for (let a = 0; a < 24; a++) g.drawImage(img, o + Math.cos(a * Math.PI / 12) * o, o + Math.sin(a * Math.PI / 12) * o, w, h);
  g.globalCompositeOperation = 'source-in'; g.fillStyle = '#1b1b2f'; g.fillRect(0, 0, c.width, c.height);
  g.globalCompositeOperation = 'source-over'; g.drawImage(img, o, o, w, h);
  return c;
}
HEADS.forEach((h) => { h.img = new Image(); h.img.onload = () => { h.sprite = makeSprite(h.img); }; h.img.src = h.src; });
const COLORS = [{ main: '#ff3b3b', dark: '#b3151c' }, { main: '#2f7bff', dark: '#1543a8' }];

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
// Résolution réelle du canvas = taille affichée × densité de l'écran (net sur Retina), le jeu reste en coordonnées 960×540.
let SCALE = 1;
function fitCanvas() {
  const s = clamp(Math.round(devicePixelRatio * (canvas.clientWidth || W) / W * 4) / 4, 1, 2.5);
  if (s === SCALE && canvas.width === Math.round(W * s)) return;
  SCALE = s; canvas.width = Math.round(W * s); canvas.height = Math.round(H * s);
  drawBackground();
}
addEventListener('resize', fitCanvas);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ================= entrées : clavier, tactile, debug =================
// e.code = position physique : KeyW/A/S/D = Z/Q/S/D sur un clavier AZERTY.
const KEYMAP = [
  { left: ['KeyA'], right: ['KeyD'], jump: ['KeyW'], kick: ['KeyS', 'Space'] },
  { left: ['ArrowLeft'], right: ['ArrowRight'], jump: ['ArrowUp'], kick: ['ArrowDown', 'Enter', 'Numpad0', 'ShiftRight'] },
];
const keysDown = new Set();
const touchHeld = new Set();
const dbgHeld = new Set();
const held = (p, k) => KEYMAP[p][k].some((c) => keysDown.has(c)) || touchHeld.has(p + ':' + k) || dbgHeld.has(p + ':' + k);
const prevHeld = [{}, {}];
const pressed = (p, k) => held(p, k) && !prevHeld[p][k];

addEventListener('keydown', (e) => {
  unlockAudio();
  if (KEYMAP.some((m) => Object.values(m).some((a) => a.includes(e.code)))) e.preventDefault();
  keysDown.add(e.code);
});
addEventListener('keyup', (e) => keysDown.delete(e.code));
addEventListener('blur', () => keysDown.clear());

let touchMode = matchMedia('(pointer: coarse)').matches;
const BTNS = [];
[['left', '◀'], ['right', '▶'], ['jump', '▲'], ['kick', '⚽']].forEach(([k, label], i) => {
  BTNS.push({ p: 0, k, label, x: 48 + i * 72, y: 505 });
  BTNS.push({ p: 1, k, label, x: [696, 768, 840, 912][[2, 3, 1, 0][i]], y: 505 });
});
// J2 : ⚽ ▲ ◀ ▶ (tir et saut vers le centre, comme J1 en miroir)
const pointers = new Map();
function toCanvas(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
}
function syncTouch() {
  touchHeld.clear();
  for (const pt of pointers.values()) {
    for (const b of BTNS) if (Math.hypot(pt.x - b.x, pt.y - b.y) < 38) touchHeld.add(b.p + ':' + b.k);
  }
}
canvas.addEventListener('pointerdown', (e) => {
  unlockAudio();
  if (e.pointerType !== 'mouse') touchMode = true;
  if (!touchMode && state === 'end' && endT > 60) { toSelect(); return; }
  try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* pointeur déjà relâché */ }
  pointers.set(e.pointerId, toCanvas(e)); syncTouch(); e.preventDefault();
});
canvas.addEventListener('pointermove', (e) => { if (pointers.has(e.pointerId)) { pointers.set(e.pointerId, toCanvas(e)); syncTouch(); } });
const endPointer = (e) => { pointers.delete(e.pointerId); syncTouch(); };
['pointerup', 'pointercancel', 'lostpointercapture'].forEach((ev) => canvas.addEventListener(ev, endPointer));
canvas.addEventListener('contextmenu', (e) => e.preventDefault());

// ================= sons (Web Audio, synthétisés) =================
let ac = null;
function unlockAudio() {
  if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
  try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { /* pas de son */ }
}
function tone(type, f0, f1, dur, vol, delay = 0) {
  if (!ac) return;
  const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur);
}
function crowd(dur, vol) {
  if (!ac) return;
  const n = ac.sampleRate * dur, buf = ac.createBuffer(1, n, ac.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.sin(Math.PI * i / n);
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  f.type = 'bandpass'; f.frequency.value = 900; f.Q.value = 0.6; g.gain.value = vol;
  s.buffer = buf; s.connect(f).connect(g).connect(ac.destination); s.start();
}
const sfx = {
  kick: () => tone('square', 190, 55, 0.12, 0.25),
  head: () => tone('triangle', 260, 120, 0.1, 0.2),
  bounce: () => tone('sine', 140, 80, 0.06, 0.12),
  jump: () => tone('sine', 320, 640, 0.1, 0.06),
  whistle: (n = 1) => { for (let i = 0; i < n; i++) tone('sine', 2300, 2200, 0.28, 0.12, i * 0.38); },
  goal: () => { crowd(1.8, 0.9); sfx.whistle(1); },
  tick: () => tone('square', 660, 660, 0.08, 0.08),
};

// ================= état du jeu =================
let state = 'select';      // select | countdown | play | goal | end
let frame = 0, cd = 0, goalT = 0, endT = 0, shake = 0, lastScorer = -1;
let timeLeft = MATCH_TIME;
const score = [0, 0];
const pick = [0, 3], ready = [false, false];
const players = [0, 1].map((i) => ({ i, f: i === 0 ? 1 : -1, x: 0, y: REST_Y, vx: 0, vy: 0, onGround: true, kickT: 0, head: pick[i] }));
const ball = { x: W / 2, y: 150, vx: 0, vy: 0, r: BALL_R, rot: 0 };
const particles = [];
const BARS = [[0, BAR_Y, GOAL_W + 4, BAR_Y + BAR_H], [W - GOAL_W - 4, BAR_Y, W, BAR_Y + BAR_H]];

function kickoff() {
  players.forEach((p) => Object.assign(p, { x: p.i === 0 ? 220 : W - 220, y: REST_Y, vx: 0, vy: 0, onGround: true, kickT: 0 }));
  // la balle retombe au centre, légèrement vers celui qui vient d'encaisser
  Object.assign(ball, { x: W / 2, y: 140, vx: lastScorer === 0 ? 1.2 : lastScorer === 1 ? -1.2 : 0, vy: 0 });
}
function startMatch() {
  score[0] = score[1] = 0; lastScorer = -1; timeLeft = MATCH_TIME;
  players.forEach((p) => { p.head = pick[p.i]; });
  kickoff(); state = 'countdown'; cd = 3 * 60 + 30; particles.length = 0;
}
function toSelect() { state = 'select'; ready[0] = ready[1] = false; particles.length = 0; }

// angle de la jambe : repos 0.3 rad, monte à 2.0 rad (pied devant et en l'air), redescend
function kickAngle(t) {
  if (t === 0) return 0.3;
  if (t <= 6) return 0.3 + 1.7 * t / 6;
  if (t <= 10) return 2.0;
  return 2.0 - 1.7 * (t - 10) / 6;
}
function footPos(p) {
  const a = kickAngle(p.kickT);
  return { x: p.x - p.f * 4 + p.f * 20 * Math.sin(a), y: p.y + R + 20 * Math.cos(a) - 2, a };
}

// ================= physique =================
function updatePlayer(p) {
  const i = p.i;
  p.vx = (held(i, 'right') - held(i, 'left')) * SPEED;
  if (held(i, 'jump') && p.onGround) { p.vy = JUMP; p.onGround = false; sfx.jump(); }
  if (pressed(i, 'kick') && p.kickT === 0) p.kickT = 1;
  else if (p.kickT > 0 && ++p.kickT > KICK_LEN) p.kickT = 0;

  const prevFeet = p.y + R + 31;
  p.vy += GRAV; p.x += p.vx; p.y += p.vy;
  p.onGround = false;
  if (p.y >= REST_Y) { p.y = REST_Y; p.vy = 0; p.onGround = true; }
  // barres transversales : on peut se poser dessus, et on s'y cogne la tête
  for (const [x0, y0, x1, y1] of BARS) {
    const feet = p.y + R + 31;
    if (p.vy >= 0 && p.x + 12 > x0 && p.x - 12 < x1 && prevFeet <= y0 + 1 && feet >= y0) {
      p.y = y0 - R - 31; p.vy = 0; p.onGround = true;
    }
    const cx = clamp(p.x, x0, x1), cy = clamp(p.y, y0, y1), dx = p.x - cx, dy = p.y - cy, d = Math.hypot(dx, dy);
    if (d < R && d > 0) {
      p.x = cx + dx / d * R; p.y = cy + dy / d * R;
      if (dy > 0 && p.vy < 0) p.vy = 0;
    }
  }
  p.x = clamp(p.x, R * 0.8, W - R * 0.8);
}

function playerVsPlayer() {
  const [a, b] = players, dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 0.01, min = 2 * R;
  if (d >= min) return;
  const nx = dx / d, ny = dy / d, push = (min - d) / 2;
  a.x -= nx * push; a.y -= ny * push; b.x += nx * push; b.y += ny * push;
  // l'un peut atterrir sur la tête de l'autre
  if (Math.abs(ny) > 0.6) {
    const top = ny > 0 ? a : b;
    if (top.vy > 0) { top.vy = 0; top.onGround = true; }
  }
  [a, b].forEach((p) => { if (p.y > REST_Y) p.y = REST_Y; p.x = clamp(p.x, R * 0.8, W - R * 0.8); });
}

// renvoie true si la balle touche le cercle (cx, cy, cr) qui se déplace à (cvx, cvy)
function bounceCircle(cx, cy, cr, cvx, cvy, rest) {
  const dx = ball.x - cx, dy = ball.y - cy, d = Math.hypot(dx, dy), min = cr + ball.r;
  if (d >= min) return false;
  const nx = d ? dx / d : 0, ny = d ? dy / d : -1;
  ball.x = cx + nx * min; ball.y = cy + ny * min;
  const vn = (ball.vx - cvx) * nx + (ball.vy - cvy) * ny;
  if (vn < 0) { ball.vx -= (1 + rest) * vn * nx; ball.vy -= (1 + rest) * vn * ny; }
  return true;
}
function bounceRect(x0, y0, x1, y1) {
  const cx = clamp(ball.x, x0, x1), cy = clamp(ball.y, y0, y1), dx = ball.x - cx, dy = ball.y - cy, d = Math.hypot(dx, dy);
  if (d >= ball.r) return;
  const nx = d ? dx / d : 0, ny = d ? dy / d : -1;
  ball.x = cx + nx * ball.r; ball.y = cy + ny * ball.r;
  const vn = ball.vx * nx + ball.vy * ny;
  if (vn < 0) { ball.vx -= 1.6 * vn * nx; ball.vy -= 1.6 * vn * ny; if (vn < -2) sfx.bounce(); }
  // posée sur la barre : elle roule vers le terrain au lieu de rester coincée
  if (ny < -0.5) ball.vx += x0 === 0 ? 0.25 : -0.25;
}

function updateBall() {
  ball.vy += BALL_GRAV; ball.vx *= 0.997;
  ball.x += ball.vx; ball.y += ball.vy;
  ball.rot += ball.vx / ball.r;
  if (ball.y > GROUND - ball.r) {
    ball.y = GROUND - ball.r;
    if (ball.vy > 2) sfx.bounce();
    ball.vy = Math.abs(ball.vy) < 1.2 ? 0 : -ball.vy * 0.72;
    ball.vx *= 0.985;
  }
  if (ball.y < ball.r) { ball.y = ball.r; ball.vy = Math.abs(ball.vy) * 0.7; }
  if (ball.x < ball.r) { ball.x = ball.r; ball.vx = Math.abs(ball.vx) * 0.7; }
  if (ball.x > W - ball.r) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx) * 0.7; }
  BARS.forEach((b) => bounceRect(...b));

  for (const p of players) {
    if (bounceCircle(p.x, p.y, R, p.vx, p.vy, 0.75)) {
      if (Math.hypot(ball.vx, ball.vy) > 4) sfx.head();
    }
    const ft = footPos(p);
    const kicking = p.kickT >= 1 && p.kickT <= 10;
    if (bounceCircle(ft.x, ft.y, FOOT_R, p.vx, p.vy, 0.5) && kicking) {
      // tir : dans l'axe pied → balle, tiré vers l'avant et un peu vers le haut
      let dx = ball.x - ft.x, dy = ball.y - ft.y;
      const d = Math.hypot(dx, dy) || 1;
      dx = dx / d + p.f * 1.2; dy = dy / d - 0.55;
      const n = Math.hypot(dx, dy);
      ball.vx = dx / n * KICK_POWER + p.vx * 0.4; ball.vy = dy / n * KICK_POWER;
      p.kickT = 11; // la jambe redescend, un seul tir par coup de pied
      sfx.kick(); shake = Math.max(shake, 3);
    }
  }
  const sp = Math.hypot(ball.vx, ball.vy);
  if (sp > BALL_MAX) { ball.vx *= BALL_MAX / sp; ball.vy *= BALL_MAX / sp; }

  if (state === 'play') {
    if (ball.x + ball.r < GOAL_W && ball.y > BAR_Y + BAR_H) goal(1);
    else if (ball.x - ball.r > W - GOAL_W && ball.y > BAR_Y + BAR_H) goal(0);
  }
}

function goal(scorer) {
  score[scorer]++; lastScorer = scorer; state = 'goal'; goalT = 110; shake = 14;
  sfx.goal();
  const gx = scorer === 0 ? W - GOAL_W / 2 : GOAL_W / 2;
  for (let i = 0; i < 90; i++) {
    particles.push({ x: gx, y: BAR_Y + 60, vx: (Math.random() - 0.5) * 12, vy: -Math.random() * 12 - 2, life: 90 + Math.random() * 40,
      c: ['#ffd93d', '#ff3b3b', '#2f7bff', '#3ddc84', '#ffffff', '#ff7ad9'][i % 6], s: 4 + Math.random() * 5, rot: Math.random() * 6 });
  }
}

function endMatch() {
  state = 'end'; endT = 0; sfx.whistle(3);
  if (score[0] !== score[1]) {
    for (let i = 0; i < 160; i++) {
      particles.push({ x: Math.random() * W, y: -20 - Math.random() * 300, vx: (Math.random() - 0.5) * 3, vy: Math.random() * 2 + 1, life: 400,
        c: ['#ffd93d', '#ff3b3b', '#2f7bff', '#3ddc84', '#ffffff', '#ff7ad9'][i % 6], s: 4 + Math.random() * 5, rot: Math.random() * 6 });
    }
  }
}

function step() {
  frame++;
  if (state === 'select') {
    for (const i of [0, 1]) {
      if (!ready[i]) {
        if (pressed(i, 'left')) pick[i] = (pick[i] + HEADS.length - 1) % HEADS.length;
        if (pressed(i, 'right')) pick[i] = (pick[i] + 1) % HEADS.length;
      }
      if (pressed(i, 'kick') || pressed(i, 'jump')) { ready[i] = !ready[i]; sfx.tick(); }
    }
    if (ready[0] && ready[1]) startMatch();
  } else if (state === 'countdown') {
    if (cd % 60 === 30 && cd > 30) sfx.tick();
    if (--cd <= 0) { state = 'play'; sfx.whistle(1); }
  } else if (state === 'play' || state === 'goal') {
    if (state === 'play') {
      timeLeft -= 1 / 60;
      if (timeLeft <= 0) { timeLeft = 0; endMatch(); }
    } else if (--goalT <= 0) { kickoff(); state = 'play'; }
    if (state !== 'end') {
      players.forEach(updatePlayer);
      playerVsPlayer();
      updateBall();
    }
  } else if (state === 'end') {
    endT++;
    if (endT > 60 && (pressed(0, 'kick') || pressed(1, 'kick'))) toSelect();
  }
  for (let i = particles.length - 1; i >= 0; i--) {
    const q = particles[i];
    q.vy += 0.25; q.vx *= 0.99; q.x += q.vx; q.y += q.vy; q.rot += 0.2;
    if (--q.life <= 0 || q.y > H + 20) particles.splice(i, 1);
  }
  if (shake > 0) shake *= 0.88;
  if (shake < 0.3) shake = 0;
  for (const i of [0, 1]) for (const k of ['left', 'right', 'jump', 'kick']) prevHeld[i][k] = held(i, k);
}

// ================= dessin =================
function rnd(seed) { return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }
function cloud(g, x, y, s) {
  g.fillStyle = '#fff'; g.strokeStyle = OUTLINE; g.lineWidth = 4;
  g.beginPath();
  [[0, 0, 26], [28, -12, 30], [58, 0, 24], [30, 8, 24]].forEach(([dx, dy, r]) => { g.moveTo(x + dx * s + r * s, y + dy * s); g.arc(x + dx * s, y + dy * s, r * s, 0, 7); });
  g.stroke(); g.fill();
}
const bg = document.createElement('canvas');
function drawBackground() {
  bg.width = Math.round(W * SCALE); bg.height = Math.round(H * SCALE);
  const g = bg.getContext('2d'), r = rnd(42);
  g.setTransform(SCALE, 0, 0, SCALE, 0, 0);
  let gr = g.createLinearGradient(0, 0, 0, 200);
  gr.addColorStop(0, '#4fb6ff'); gr.addColorStop(1, '#bdeeff');
  g.fillStyle = gr; g.fillRect(0, 0, W, 200);
  // soleil
  g.fillStyle = '#ffd93d'; g.strokeStyle = OUTLINE; g.lineWidth = 5;
  g.beginPath(); g.arc(840, 60, 34, 0, 7); g.fill(); g.stroke();
  cloud(g, 90, 60, 0.9); cloud(g, 380, 38, 0.7); cloud(g, 620, 80, 0.6);
  // tribunes
  g.fillStyle = '#34457d'; g.beginPath(); g.moveTo(0, 120); g.lineTo(W, 120); g.lineTo(W, 320); g.lineTo(0, 320); g.fill();
  g.fillStyle = '#26335e'; for (let y = 140; y < 320; y += 30) g.fillRect(0, y, W, 5);
  const shirts = ['#ff3b3b', '#2f7bff', '#ffd93d', '#ffffff', '#3ddc84', '#ff7ad9', '#ff9f1c'];
  const skins = ['#f6c9a0', '#e0a878', '#b67a4f', '#7a4b2a', '#ffdcb8'];
  for (let y = 132; y < 312; y += 15) for (let x = 6; x < W; x += 15) {
    if (r() < 0.12) continue;
    const jx = x + (r() - 0.5) * 6;
    g.fillStyle = shirts[(r() * shirts.length) | 0]; g.fillRect(jx - 5, y + 2, 10, 9);
    g.fillStyle = skins[(r() * skins.length) | 0]; g.beginPath(); g.arc(jx, y, 4.5, 0, 7); g.fill();
  }
  g.strokeStyle = OUTLINE; g.lineWidth = 5; g.strokeRect(-5, 120, W + 10, 200);
  // panneaux publicitaires
  const ads = [['CARLITO', '#ff3b3b'], ['SOCCER', '#2f7bff'], ['⚽ GOAL !', '#ffd93d'], ['CARLITO', '#3ddc84'], ['SOCCER', '#ff7ad9'], ['OLÉ !', '#ff9f1c']];
  ads.forEach(([t, c], i) => {
    const x = i * 160;
    g.fillStyle = c; g.fillRect(x, 318, 160, 26);
    g.strokeStyle = OUTLINE; g.lineWidth = 3; g.strokeRect(x, 318, 160, 26);
    g.fillStyle = c === '#ffd93d' ? OUTLINE : '#fff'; g.font = '20px "Luckiest Guy", Impact, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(t, x + 80, 333);
  });
  // pelouse en bandes
  for (let i = 0; i < 12; i++) { g.fillStyle = i % 2 ? '#56c043' : '#4ab338'; g.fillRect(i * 80, 344, 80, GROUND - 344); }
  g.strokeStyle = 'rgba(255,255,255,0.85)'; g.lineWidth = 4;
  g.beginPath(); g.moveTo(W / 2, 346); g.lineTo(W / 2, GROUND); g.stroke();
  g.beginPath(); g.ellipse(W / 2, 410, 110, 36, 0, 0, 7); g.stroke();
  g.beginPath(); g.moveTo(GOAL_W, 380); g.lineTo(190, 380); g.lineTo(190, GROUND); g.stroke();
  g.beginPath(); g.moveTo(W - GOAL_W, 380); g.lineTo(W - 190, 380); g.lineTo(W - 190, GROUND); g.stroke();
  // bord du terrain
  g.fillStyle = '#3a9a2c'; g.fillRect(0, GROUND, W, H - GROUND);
  g.fillStyle = '#338a26'; for (let x = 0; x < W; x += 24) g.fillRect(x, GROUND + 8 + (x % 48 ? 0 : 14), 12, 4);
  g.strokeStyle = OUTLINE; g.lineWidth = 5; g.beginPath(); g.moveTo(0, GROUND + 2); g.lineTo(W, GROUND + 2); g.stroke();
}

function drawNet(left) {
  const x0 = left ? 0 : W - GOAL_W, x1 = x0 + GOAL_W;
  ctx.save();
  ctx.fillStyle = 'rgba(255,255,255,0.18)'; ctx.fillRect(x0, BAR_Y, GOAL_W, GROUND - BAR_Y);
  ctx.beginPath(); ctx.rect(x0, BAR_Y, GOAL_W, GROUND - BAR_Y); ctx.clip();
  ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 2;
  for (let k = -200; k < 300; k += 14) {
    ctx.beginPath(); ctx.moveTo(x0 + k, BAR_Y); ctx.lineTo(x0 + k + 200, GROUND); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x1 - k, BAR_Y); ctx.lineTo(x1 - k - 200, GROUND); ctx.stroke();
  }
  ctx.restore();
}
function drawGoalFrame(left) {
  const [x0, y0, x1] = BARS[left ? 0 : 1], postX = left ? GOAL_W - 4 : W - GOAL_W - 4;
  ctx.fillStyle = '#fff'; ctx.strokeStyle = OUTLINE; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.roundRect(postX, y0, 8, GROUND - y0, 3); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.roundRect(x0 - 4, y0, x1 - x0 + 8, BAR_H, 4); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#ff3b3b';
  for (let x = x0 + 8; x < x1 - 8; x += 22) ctx.fillRect(x, y0 + 2, 9, BAR_H - 4);
}

function drawShoe(p, col) {
  const ft = footPos(p);
  ctx.save();
  ctx.translate(ft.x, ft.y); ctx.scale(p.f, 1); ctx.rotate(-(ft.a - 0.3) * 0.7);
  ctx.lineWidth = 3.5; ctx.strokeStyle = OUTLINE;
  // chaussette
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.roundRect(-11, -20, 13, 14, 3); ctx.fill(); ctx.stroke();
  ctx.fillStyle = col.main; ctx.fillRect(-9.5, -15, 10, 4);
  // crampon
  ctx.fillStyle = col.main;
  ctx.beginPath();
  ctx.moveTo(-14, -9); ctx.lineTo(4, -9);
  ctx.quadraticCurveTo(21, -7, 21, 4); ctx.lineTo(21, 7); ctx.lineTo(-15, 7);
  ctx.quadraticCurveTo(-18, -2, -14, -9); ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = OUTLINE; ctx.fillRect(-15, 5, 36, 4);
  [-10, 0, 12].forEach((x) => ctx.fillRect(x, 8, 4, 4));
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5;
  [-7, -1, 5].forEach((x) => { ctx.beginPath(); ctx.moveTo(x, -7); ctx.lineTo(x + 4, 3); ctx.stroke(); });
  ctx.restore();
}
function drawHead(head, x, y, f, h, tilt = 0) {
  if (!head.sprite) return;
  const k = h / SPRITE_H, sw = head.sprite.width * k, sh = head.sprite.height * k;
  ctx.save();
  ctx.translate(x, y); ctx.rotate(tilt); ctx.scale(f, 1);
  ctx.drawImage(head.sprite, -sw / 2, -sh / 2, sw, sh);
  ctx.restore();
}
function drawPlayer(p) {
  const col = COLORS[p.i];
  drawShoe(p, col);
  drawHead(HEADS[p.head], p.x, p.y - 2, p.f, 2 * R * 1.12, p.vx * 0.012 + (p.onGround ? 0 : p.f * p.vy * -0.006));
  // pastille du joueur
  ctx.font = '16px "Luckiest Guy", Impact, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  outlinedText(p.i === 0 ? 'J1' : 'J2', p.x, p.y - R - 22, col.main, 4);
}
function drawBall() {
  ctx.save();
  ctx.translate(ball.x, ball.y); ctx.rotate(ball.rot);
  ctx.fillStyle = '#fff'; ctx.strokeStyle = OUTLINE; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(0, 0, ball.r, 0, 7); ctx.fill();
  ctx.save(); ctx.clip();
  ctx.fillStyle = OUTLINE;
  const pent = (cx, cy, s) => { ctx.beginPath(); for (let k = 0; k < 5; k++) { const a = -Math.PI / 2 + k * 2 * Math.PI / 5; ctx.lineTo(cx + Math.cos(a) * s, cy + Math.sin(a) * s); } ctx.fill(); };
  pent(0, 0, 5.5);
  for (let k = 0; k < 5; k++) { const a = -Math.PI / 2 + k * 2 * Math.PI / 5; pent(Math.cos(a) * 15, Math.sin(a) * 15, 5); }
  ctx.restore();
  ctx.beginPath(); ctx.arc(0, 0, ball.r, 0, 7); ctx.stroke();
  ctx.restore();
}
function shadow(x, y) {
  const s = clamp(1 - (GROUND - y) / 350, 0.3, 1);
  ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.beginPath(); ctx.ellipse(x, GROUND + 2, 26 * s, 6 * s, 0, 0, 7); ctx.fill();
}
function outlinedText(t, x, y, fill, lw = 6) {
  ctx.lineJoin = 'round'; ctx.lineWidth = lw; ctx.strokeStyle = OUTLINE; ctx.strokeText(t, x, y);
  ctx.fillStyle = fill; ctx.fillText(t, x, y);
}
const font = (s) => s + 'px "Luckiest Guy", Impact, sans-serif';

function drawHud() {
  ctx.fillStyle = 'rgba(27,27,47,0.85)'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.roundRect(W / 2 - 170, 8, 340, 62, 16); ctx.fill(); ctx.stroke();
  drawHead(HEADS[players[0].head], W / 2 - 138, 39, 1, 48);
  drawHead(HEADS[players[1].head], W / 2 + 138, 39, -1, 48);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = font(40);
  outlinedText(String(score[0]), W / 2 - 78, 44, COLORS[0].main);
  outlinedText(String(score[1]), W / 2 + 78, 44, COLORS[1].main);
  ctx.font = font(30);
  const t = Math.ceil(timeLeft);
  outlinedText(t + '', W / 2, 44, t <= 10 ? '#ff5b5b' : '#ffd93d');
}
function drawButtons() {
  if (!touchMode) return;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = font(24);
  for (const b of BTNS) {
    const on = touchHeld.has(b.p + ':' + b.k);
    ctx.globalAlpha = on ? 0.95 : 0.6;
    ctx.fillStyle = on ? COLORS[b.p].main : 'rgba(27,27,47,0.8)'; ctx.strokeStyle = on ? '#fff' : COLORS[b.p].main; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(b.x, b.y, 30, 0, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.fillText(b.label, b.x, b.y + 2);
  }
  ctx.globalAlpha = 1;
}

function drawSelect() {
  ctx.fillStyle = 'rgba(20,24,50,0.72)'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = font(72);
  ctx.save(); ctx.translate(W / 2, 70); ctx.rotate(Math.sin(frame / 30) * 0.03);
  outlinedText('CARLITO SOCCER', 0, 0, '#ffd93d', 10); ctx.restore();
  ctx.font = font(22); outlinedText('Choisis ta tête !', W / 2, 125, '#fff', 5);
  const cw = 150, x0 = W / 2 - (HEADS.length - 1) * cw / 2;
  HEADS.forEach((h, k) => {
    const x = x0 + k * cw, y = 250;
    const bob = Math.sin(frame / 20 + k) * 4;
    ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.beginPath(); ctx.roundRect(x - 64, y - 82, 128, 180, 18); ctx.fill();
    [0, 1].forEach((i) => {
      if (pick[i] !== k) return;
      ctx.strokeStyle = COLORS[i].main; ctx.lineWidth = 6;
      ctx.beginPath(); ctx.roundRect(x - 64 - i * 7, y - 82 - i * 7, 128 + i * 14, 180 + i * 14, 18 + i * 4); ctx.stroke();
      ctx.font = font(20);
      outlinedText((i === 0 ? 'J1' : 'J2') + (ready[i] ? ' ✔' : ''), x + (i === 0 ? -34 : 34), y - 98 - i * 7, ready[i] ? '#3ddc84' : COLORS[i].main, 5);
    });
    drawHead(h, x, y - 8 + bob, 1, 120);
    ctx.font = font(20); outlinedText(h.name, x, y + 76, '#fff', 5);
  });
  ctx.font = font(18);
  outlinedText('J1 :  Q / D choisir  •  S ou Z : prêt', W / 2 - 230, 400, COLORS[0].main, 5);
  outlinedText('J2 :  ← / → choisir  •  ↓ ou ↑ : prêt', W / 2 + 230, 400, COLORS[1].main, 5);
  ctx.font = font(15);
  outlinedText('En match — J1 : Q D bouger, Z sauter, S ou Espace tirer   |   J2 : ← → bouger, ↑ sauter, ↓ ou Entrée tirer', W / 2, 436, '#fff', 4);
}

function render() {
  ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
  ctx.imageSmoothingQuality = 'high';
  ctx.save();
  if (shake) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  ctx.drawImage(bg, 0, 0, W, H);
  drawNet(true); drawNet(false);
  if (state !== 'select') {
    players.forEach((p) => shadow(p.x, p.y + R + 31));
    shadow(ball.x, ball.y + ball.r);
    players.forEach(drawPlayer);
    drawBall();
  }
  drawGoalFrame(true); drawGoalFrame(false);
  for (const q of particles) {
    ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.rot); ctx.fillStyle = q.c; ctx.fillRect(-q.s / 2, -q.s / 4, q.s, q.s / 2); ctx.restore();
  }
  ctx.restore();

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (state === 'select') drawSelect();
  else drawHud();
  if (state === 'countdown') {
    const n = Math.ceil((cd - 30) / 60);
    ctx.font = font(n > 0 ? 120 : 100);
    outlinedText(n > 0 ? String(n) : 'GO !', W / 2, H / 2 - 30, '#ffd93d', 12);
  }
  if (state === 'goal') {
    const k = Math.min(1, (110 - goalT) / 12);
    ctx.save(); ctx.translate(W / 2, H / 2 - 40); ctx.scale(k * (1 + Math.sin(frame / 5) * 0.04), k); ctx.rotate(-0.06);
    ctx.font = font(110); outlinedText('BUUUT !', 0, 0, COLORS[lastScorer].main, 14);
    ctx.font = font(30); outlinedText(HEADS[players[lastScorer].head].name, 0, 70, '#fff', 7);
    ctx.restore();
  }
  if (state === 'end') {
    ctx.fillStyle = 'rgba(20,24,50,0.6)'; ctx.fillRect(0, 0, W, H);
    const win = score[0] === score[1] ? -1 : score[0] > score[1] ? 0 : 1;
    ctx.font = font(76);
    if (win < 0) {
      outlinedText('ÉGALITÉ !', W / 2, 150, '#ffd93d', 12);
      drawHead(HEADS[players[0].head], W / 2 - 110, 290, 1, 150);
      drawHead(HEADS[players[1].head], W / 2 + 110, 290, -1, 150);
    } else {
      outlinedText('VICTOIRE !', W / 2, 140, COLORS[win].main, 12);
      drawHead(HEADS[players[win].head], W / 2, 290 + Math.sin(frame / 8) * 8, 1, 190, Math.sin(frame / 12) * 0.1);
      ctx.font = font(36); outlinedText(HEADS[players[win].head].name, W / 2, 410, '#fff', 8);
    }
    ctx.font = font(44); outlinedText(score[0] + ' - ' + score[1], W / 2, 210, '#fff', 8);
    if (endT > 60) { ctx.font = font(20); outlinedText(touchMode ? 'Appuie sur ⚽ pour rejouer' : 'Tire (S ou ↓) pour rejouer', W / 2, 455, '#ffd93d', 5); }
  }
  drawButtons();
}

// ================= boucle =================
fitCanvas(); drawBackground();
document.fonts?.load(font(20)).then(drawBackground).catch(() => {});
let acc = 0, last = performance.now();
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) { step(); acc -= 1000 / 60; }
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

if (DEBUG) {
  window.__hb = {
    consts: { W, H, GROUND, R, FOOT_R, REST_Y, GOAL_W, BAR_Y, BAR_H, BALL_R, MATCH_TIME, KICK_LEN },
    heads: HEADS, btns: BTNS,
    start(a = 0, b = 3) { pick[0] = a; pick[1] = b; startMatch(); cd = 1; step(); },
    toSelect, run(n = 1) { for (let i = 0; i < n; i++) step(); },
    press(p, k) { dbgHeld.add(p + ':' + k); }, release(p, k) { dbgHeld.delete(p + ':' + k); },
    releaseAll() { dbgHeld.clear(); },
    info: () => ({ state, score: [...score], timeLeft, pick: [...pick], ready: [...ready], touchMode }),
    ball: () => ball, players: () => players, footPos, touchHeld: () => [...touchHeld],
    setTime(s) { timeLeft = s; }, setTouchMode(b) { touchMode = b; }, render,
  };
}
</script>
</body>
</html>
