<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">

  #turn { display: none; position: fixed; inset: 0; background: #1a1f3a; color: #ffd93d; font-size: 28px; text-align: center; align-items: center; justify-content: center; padding: 24px; -webkit-text-stroke: 1px #000; }
  @media (orientation: portrait) and (pointer: coarse) { #turn { display: flex; } }

<body>
<canvas id="c" width="960" height="540"></canvas>
<div id="turn">📱↻<br>Tourne ton téléphone<br>pour jouer !</div>
<script>
'use strict';
// ================= réglages =================
const W = 960, H = 540, GROUND = 470;
const R = 40;                    // rayon (physique) de la tête
const FOOT_R = 13;               // rayon de la chaussure
const REST_Y = GROUND - R - 31;  // y de la tête quand le joueur est au sol
const SPEED = 5.2, JUMP = -14.5, GRAV = 0.8;
const BALL_R = 15, BALL_GRAV = 0.4, BALL_MAX = 21;
const GOAL_W = 78, BAR_Y = GROUND - 175, BAR_H = 10;
const KICK_LEN = 16, KICK_POWER = 17;
// Effet (spin) : la balle tourne, sa trajectoire se courbe (effet Magnus) et son rebond change.
// spin > 0 = sens horaire à l'écran (lift pour J1 = brossé vers le bas) ; MAGNUS règle la force de la courbe.
const MAGNUS = 0.045, SPIN_DECAY = 0.985;
// Poteaux : vu de côté, le poteau vertical est la ligne de but ; seul le haut du poteau (le coin du cadre, POST_LEN px sous
// la barre) est solide et renvoie la balle très fort. Plus bas, la balle passe et c'est but.
const POST_R = 7, POST_LEN = 30, POST_BOUNCE = 0.92;
const POSTS = [GOAL_W, W - GOAL_W]; // x des poteaux
// Vent : tiré au hasard à chaque match (calme, léger, moyen, fort, vers la gauche ou la droite), avec des rafales.
// Il pousse la balle seulement quand elle est en l'air (px/image²).
const WINDS = [0, 0.02, 0.035, 0.05];
// Ballons : un tiré au hasard à chaque match (le classique 2 fois sur 5, les autres 1 fois sur 5).
//   r : rayon, grav : gravité, drag : freinage dans l'air, bounce : rebond au sol, wall : rebond barre/poteaux (×),
//   head : rebond sur la tête, kick : puissance des tirs (×), wind : sensibilité au vent (×)
const BALLS = {
  classique: { name: 'CLASSIQUE', r: 15, grav: 0.4, drag: 0.997, bounce: 0.71, wall: 1, head: 0.75, kick: 1, wind: 1, weight: 2 },
  plage: { name: 'BALLON DE PLAGE', r: 22, grav: 0.22, drag: 0.985, bounce: 0.6, wall: 0.8, head: 0.85, kick: 0.82, wind: 1.7, weight: 1 },
  boulet: { name: 'BOULET', r: 14, grav: 0.55, drag: 0.999, bounce: 0.38, wall: 0.55, head: 0.45, kick: 0.82, wind: 0.25, weight: 1 },
  superballe: { name: 'SUPER BALLE', r: 12, grav: 0.4, drag: 0.998, bounce: 0.92, wall: 1.15, head: 0.95, kick: 1.05, wind: 1, weight: 1 },
};
function randomBall() {
  const bag = Object.keys(BALLS).flatMap((k) => Array(BALLS[k].weight).fill(k));
  return bag[(Math.random() * bag.length) | 0];
}
// Types de tir, choisis selon ce que fait le joueur au moment du tir (aucun bouton en plus) :
//   power : vitesse, lift : angle vers le haut (rad), spin : effet (positif = brossé, la balle plonge ; négatif = rétro, elle flotte)
const SHOTS = {
  normal: { power: 17, lift: 0.5, spin: 0.12, label: '' },
  missile: { power: 19.5, lift: 0.14, spin: 0.22, label: 'MISSILE !' }, // en courant vers le but, balle basse
  lob: { power: 15, lift: 1.05, spin: -0.3, label: 'LOB !' },          // en reculant
  volee: { power: 20, lift: 0.05, spin: 0.3, label: 'VOLÉE !' },       // en l'air
};
// Jauge de super coup, réservée aux têtes marquées fire: true (Maxou) : chaque touche de balle la remplit ; pleine,
// le prochain tir ou la prochaine tête part en feu, tout droit dans le but adverse, en traversant les joueurs.
const POWER_KICK = 18, POWER_HEAD = 12, POWER_TOUCH = 5, FIRE_SPEED = 19;
const MATCH_TIME = 60;           // secondes
const STICK = 50, SWIPE_UP = 40; // joystick tactile invisible : course max du pouce, glissé vers le haut pour sauter
const OUTLINE = '#1b1b2f';
const DEBUG = new URLSearchParams(location.search).has('debug');

// Pour renommer un personnage, change son nom ici.
// flip: true = la photo regarde vers la gauche : on la retourne pour que le joueur regarde vers l'avant.
const HEADS = [
  { src: 'heads/p1.png', name: 'Carlito', flip: true },
  { src: 'heads/p2.png', name: 'Moustache' },
  { src: 'heads/p3.png', name: 'Nono', flip: true },
  { src: 'heads/p4.png', name: 'Le Boss', boss: true }, // réservé à l'IA : on ne peut pas le choisir
  { src: 'heads/p5.png', name: 'Éclipse', flip: true },
  { src: 'heads/p6.png', name: 'Maxou', fire: true }, // le seul à avoir la jauge et le ballon en feu
];
// Chaque tête détourée reçoit un contour noir cartoon qui suit sa silhouette (calculé une fois au chargement).
const SPRITE_H = 360, SPRITE_O = 13;
function makeSprite(img) {
  const h = SPRITE_H, w = Math.round(h * img.naturalWidth / img.naturalHeight), o = SPRITE_O;
  const c = document.createElement('canvas'); c.width = w + 2 * o; c.height = h + 2 * o;
  const g = c.getContext('2d');
  for (let a = 0; a < 24; a++) g.drawImage(img, o + Math.cos(a * Math.PI / 12) * o, o + Math.sin(a * Math.PI / 12) * o, w, h);
  g.globalCompositeOperation = 'source-in'; g.fillStyle = '#1b1b2f'; g.fillRect(0, 0, c.width, c.height);
  g.globalCompositeOperation = 'source-over'; g.drawImage(img, o, o, w, h);
  return c;
}
HEADS.forEach((h) => { h.img = new Image(); h.img.onload = () => { h.sprite = makeSprite(h.img); }; h.img.src = h.src; });
const BOSS = HEADS.findIndex((h) => h.boss);
const PICKABLE = HEADS.map((_, k) => k).filter((k) => k !== BOSS); // têtes proposées aux joueurs
const nextPick = (h, d) => PICKABLE[(PICKABLE.indexOf(h) + d + PICKABLE.length) % PICKABLE.length];
const COLORS = [{ main: '#ff3b3b', dark: '#b3151c' }, { main: '#2f7bff', dark: '#1543a8' }];

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
// Résolution réelle du canvas = taille affichée × densité de l'écran (net sur Retina), le jeu reste en coordonnées 960×540.
let SCALE = 1;
function fitCanvas() {
  const s = clamp(Math.round(devicePixelRatio * (canvas.clientWidth || W) / W * 4) / 4, 1, 2.5);
  if (s === SCALE && canvas.width === Math.round(W * s)) return;
  SCALE = s; canvas.width = Math.round(W * s); canvas.height = Math.round(H * s);
  drawBackground();
}
addEventListener('resize', fitCanvas);

// ================= modes =================
// mode : 'ai' (contre l'ordinateur), 'local' (2 joueurs, même écran), 'online' (contre un joueur en ligne)
let mode = 'local', aiLevel = 1;
let me = 0;                       // joueur contrôlé par cet appareil en solo / en ligne (1 = invité en ligne)
const aiSlots = [null, null];     // niveau d'IA de chaque joueur (null = humain)
const AI_LEVELS = [
  { name: 'Facile', delay: 40, kick: 0.05, jump: 0.08, dead: 45, err: 80, lazy: 0.7 },
  { name: 'Moyen', delay: 6, kick: 0.6, jump: 0.85, dead: 10, err: 14, lazy: 0.15 },
  { name: 'Difficile', delay: 3, kick: 0.9, jump: 1, dead: 6, err: 6, lazy: 0 },
];
const MENU = [
  { label: "CONTRE L'IA · FACILE", mode: 'ai', lvl: 0, c: '#3ddc84' },
  { label: "CONTRE L'IA · MOYEN", mode: 'ai', lvl: 1, c: '#ffd93d' },
  { label: "CONTRE L'IA · DIFFICILE", mode: 'ai', lvl: 2, c: '#ff3b3b' },
  { label: '2 JOUEURS · MÊME ÉCRAN', mode: 'local', c: '#2f7bff' },
  { label: 'EN LIGNE', mode: 'online', c: '#ff7ad9' },
];
const pillRect = (k) => ({ x: W / 2 - 240, y: 138 + k * 66, w: 480, h: 54 });
const cardX = (j) => W / 2 + (j - (PICKABLE.length - 1) / 2) * 150; // j = rang dans PICKABLE
let menuSel = 0;

// ================= entrées =================
// Chaque joueur a un contrôle unifié : x (-1..1), saut tenu, et des files d'attente courtes pour le tir et le saut
// (un tap rapide n'est jamais perdu, même s'il arrive entre deux images ou par le réseau).
const ctl = [0, 1].map(() => ({ x: 0, jump: false, kickQ: 0, jumpQ: 0, prevK: false, prevJ: false, sentK: 0, sentJ: 0, seenK: 0, seenJ: 0 }));
function queueKick(i) { ctl[i].kickQ = 6; ctl[i].sentK++; }
function queueJump(i) { ctl[i].jumpQ = 8; ctl[i].sentJ++; }
function resetCtl() { ctl.forEach((c) => Object.assign(c, { x: 0, jump: false, kickQ: 0, jumpQ: 0, prevK: false, prevJ: false, sentK: 0, sentJ: 0, seenK: 0, seenJ: 0 })); }

// e.code = position physique : KeyW/A/S/D = Z/Q/S/D sur un clavier AZERTY.
const KEYMAP = [
  { left: ['KeyA'], right: ['KeyD'], jump: ['KeyW'], kick: ['KeyS', 'Space'] },
  { left: ['ArrowLeft'], right: ['ArrowRight'], jump: ['ArrowUp'], kick: ['ArrowDown', 'Enter', 'Numpad0', 'ShiftRight'] },
];
const GAME_KEYS = new Set(KEYMAP.flatMap((m) => Object.values(m).flat()).concat(['Escape']));
const keysDown = new Set();
const dbgHeld = new Set();
const anyKey = (m, k) => KEYMAP[m][k].some((c) => keysDown.has(c));
addEventListener('keydown', (e) => {
  unlockAudio();
  if (GAME_KEYS.has(e.code)) e.preventDefault();
  if (!e.repeat) uiKey(e.code);
  keysDown.add(e.code);
});
addEventListener('keyup', (e) => keysDown.delete(e.code));
addEventListener('blur', () => keysDown.clear());

// ---- tactile sans boutons, façon Brawl Stars ----
// Le pouce posé devient le centre d'un joystick invisible (qui suit le pouce s'il va trop loin) :
// glisser à gauche/droite = courir, glisser vers le haut = sauter, taper = tirer.
// Solo / en ligne : moitié gauche = joystick, moitié droite = tirer (taper) ou sauter (glisser vers le haut).
// 2 joueurs sur le même écran : chaque joueur a sa moitié d'écran (un 2e doigt dans sa moitié = tirer).
let touchMode = matchMedia('(pointer: coarse)').matches;
const touches = new Map();
const IN_MATCH = ['countdown', 'play', 'goal'];
function toCanvas(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
}
document.addEventListener('pointerdown', (e) => {
  unlockAudio();
  if (e.pointerType !== 'mouse') touchMode = true;
  e.preventDefault();
  const pt = toCanvas(e);
  if (!IN_MATCH.includes(state)) { uiTap(pt); return; }
  const p = mode === 'local' ? (pt.x < W / 2 ? 0 : 1) : me;
  const hasStick = [...touches.values()].some((t) => t.p === p && t.role === 'stick');
  const role = hasStick ? 'action' : mode === 'local' || pt.x < W / 2 ? 'stick' : 'action';
  touches.set(e.pointerId, { p, role, x0: pt.x, y0: pt.y, x: pt.x, y: pt.y, t0: performance.now(), moved: 0, up: false });
  if (role === 'action') queueKick(p);
}, { passive: false });
document.addEventListener('pointermove', (e) => {
  const t = touches.get(e.pointerId);
  if (!t) return;
  const pt = toCanvas(e);
  t.moved = Math.max(t.moved, Math.hypot(pt.x - t.x0, pt.y - t.y0));
  t.x = pt.x; t.y = pt.y;
  const dx = t.x - t.x0;
  if (t.role === 'stick' && Math.abs(dx) > STICK) t.x0 = t.x - Math.sign(dx) * STICK;
  const dy = t.y - t.y0;
  if (dy < -SWIPE_UP && !t.up) { t.up = true; queueJump(t.p); }
  else if (dy > -SWIPE_UP / 2 && t.up) { t.up = false; t.y0 = Math.min(t.y0, t.y + SWIPE_UP / 2); }
  if (t.up && dy < -SWIPE_UP * 2) t.y0 = t.y + SWIPE_UP * 2; // le pouce peut remonter sans fin
});
function endTouch(e) {
  const t = touches.get(e.pointerId);
  if (!t) return;
  touches.delete(e.pointerId);
  if (t.role === 'stick' && t.moved < 14 && performance.now() - t.t0 < 250 && IN_MATCH.includes(state)) queueKick(t.p);
}
['pointerup', 'pointercancel'].forEach((ev) => document.addEventListener(ev, endTouch));
document.addEventListener('contextmenu', (e) => e.preventDefault());
function touchInput(i) {
  let x = 0, up = false, any = false;
  for (const t of touches.values()) {
    if (t.p !== i) continue;
    any = true;
    if (t.up) up = true;
    if (t.role === 'stick') { const dx = t.x - t.x0; x = Math.abs(dx) < 8 ? 0 : clamp(dx / (STICK * 0.6), -1, 1); }
  }
  return any ? { x, up } : null;
}

function gatherInputs() {
  for (const i of [0, 1]) {
    const c = ctl[i];
    let L = false, Rr = false, J = false, K = false;
    const owners = mode === 'local' ? [i] : i === me ? [0, 1] : [];
    for (const m of owners) { L = L || anyKey(m, 'left'); Rr = Rr || anyKey(m, 'right'); J = J || anyKey(m, 'jump'); K = K || anyKey(m, 'kick'); }
    L = L || dbgHeld.has(i + ':left'); Rr = Rr || dbgHeld.has(i + ':right'); J = J || dbgHeld.has(i + ':jump'); K = K || dbgHeld.has(i + ':kick');
    let x = (Rr ? 1 : 0) - (L ? 1 : 0);
    const t = touchInput(i);
    if (t) { if (!x) x = t.x; J = J || t.up; }
    if (aiSlots[i] !== null) ({ x, J, K } = aiThink(players[i], AI_LEVELS[aiSlots[i]]));
    if (net && net.role === 0 && i === 1) {
      const r = net.remote; x = clamp(+r.x || 0, -1, 1); J = !!r.j;
      if (r.k > c.seenK) { c.seenK = r.k; c.kickQ = 6; }
      if (r.jc > c.seenJ) { c.seenJ = r.jc; c.jumpQ = 8; }
    }
    c.x = x; c.jump = J;
    if (K && !c.prevK) queueKick(i);
    c.prevK = K; c.prevJ = J;
  }
}

// ================= IA =================
// Elle voit la balle avec un temps de réaction (delay images), se place derrière la balle pour la pousser
// vers le but adverse, saute pour les têtes et tire quand la balle est devant son pied.
const ballHist = [];
function aiThink(p, L) {
  const b = ballHist[Math.max(0, ballHist.length - 1 - L.delay)] || ball;
  const f = p.f;
  if (frame % 50 === p.i) p.aiErr = (Math.random() - 0.5) * L.err;
  if (frame % 30 === 0) p.aiLazy = Math.random() < L.lazy;
  const bx = clamp(b.x + b.vx * 10, 20, W - 20);
  const behind = (b.x - p.x) * f < 0;                // balle entre moi et mon but
  const target = behind ? bx - f * 90 : bx - f * (26 + (p.aiErr || 0));
  const dx = target - p.x;
  let x = Math.abs(dx) > L.dead && !p.aiLazy ? Math.sign(dx) : 0;
  let J = false;
  const near = Math.abs(b.x - p.x);
  if (!behind && b.y < p.y - 20 && near < 55 && b.vy > -4 && Math.random() < L.jump * 0.3) J = true; // tête
  // balle derrière moi : je saute par-dessus pour repasser derrière elle (sinon je la pousse dans mon but)
  if (behind && near < 120 && b.y > p.y - 70 && Math.random() < L.jump) J = true;
  if (behind && near < 120 && b.y > p.y - 70 && !J && p.onGround) x = 0;           // j'attends plutôt que de la pousser
  const ft = footPos(p);
  const K = Math.hypot(ball.x - ft.x, ball.y - ft.y) < 42 && (ball.x - p.x) * f > 0 && Math.random() < L.kick * 0.35;
  return { x, J, K };
}

// ================= sons (Web Audio, synthétisés) =================
let ac = null;
function unlockAudio() {
  if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
  try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { /* pas de son */ }
}
function tone(type, f0, f1, dur, vol, delay = 0) {
  if (!ac) return;
  const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur);
}
function crowd(dur, vol) {
  if (!ac) return;
  const n = ac.sampleRate * dur, buf = ac.createBuffer(1, n, ac.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.sin(Math.PI * i / n);
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  f.type = 'bandpass'; f.frequency.value = 900; f.Q.value = 0.6; g.gain.value = vol;
  s.buffer = buf; s.connect(f).connect(g).connect(ac.destination); s.start();
}
const sfx = {
  kick: () => tone('square', 190, 55, 0.12, 0.25),
  head: () => tone('triangle', 260, 120, 0.1, 0.2),
  bounce: () => tone('sine', 140, 80, 0.06, 0.12),
  post: () => { tone('triangle', 1500, 1300, 0.35, 0.16); tone('sine', 2250, 2150, 0.3, 0.08); }, // « ting » métallique
  jump: () => tone('sine', 320, 640, 0.1, 0.06),
  whistle: () => tone('sine', 2300, 2200, 0.28, 0.12),
  final: () => { for (let i = 0; i < 3; i++) tone('sine', 2300, 2200, 0.28, 0.12, i * 0.38); },
  goal: () => { crowd(1.8, 0.9); sfx.whistle(); },
  tick: () => tone('square', 660, 660, 0.08, 0.08),
  fire: () => { crowd(0.7, 0.7); tone('sawtooth', 140, 40, 0.6, 0.18); },
};
const events = [];
// joue un son, et le transmet à l'invité quand on héberge une partie en ligne
function play(name) { sfx[name](); if (net && net.role === 0) events.push(name); }

// ================= état du jeu =================
let state = 'menu';        // menu | select | wait | countdown | play | goal | end
let frame = 0, cd = 0, goalT = 0, endT = 0, shake = 0, lastScorer = -1, endNote = '', waitMsg = '';
let timeLeft = MATCH_TIME;
const score = [0, 0];
const pick = [0, 4], ready = [false, false];
const players = [0, 1].map((i) => ({ i, f: i === 0 ? 1 : -1, x: 0, y: REST_Y, vx: 0, vy: 0, onGround: true, kickT: 0, head: pick[i], power: 0, touchCd: 0 }));
const ball = { x: W / 2, y: 150, vx: 0, vy: 0, r: BALL_R, rot: 0, fire: 0, fireBy: 0, spin: 0, type: 'classique' };
const BT = () => BALLS[ball.type]; // réglages du ballon du match
const pop = { text: '', x: 0, y: 0, t: 0 }; // nom du coup affiché au-dessus de la balle
let superT = 0;
let wind = 0; // durée d'affichage de « SUPER TIR ! »
const particles = [];
const BARS = [[0, BAR_Y, GOAL_W + 4, BAR_Y + BAR_H], [W - GOAL_W - 4, BAR_Y, W, BAR_Y + BAR_H]];

function setBall(type) { ball.type = BALLS[type] ? type : 'classique'; ball.r = BT().r; }
function kickoff() {
  players.forEach((p) => Object.assign(p, { x: p.i === 0 ? 220 : W - 220, y: REST_Y, vx: 0, vy: 0, onGround: true, kickT: 0 }));
  // la balle retombe au centre, légèrement vers celui qui vient d'encaisser
  Object.assign(ball, { x: W / 2, y: 140, vx: lastScorer === 0 ? 1.2 : lastScorer === 1 ? -1.2 : 0, vy: 0, fire: 0, spin: 0 });
  pop.t = 0;
  ballHist.length = 0;
}
function startMatch() {
  score[0] = score[1] = 0; lastScorer = -1; timeLeft = MATCH_TIME; endNote = '';
  players.forEach((p) => { p.head = pick[p.i]; p.power = 0; p.touchCd = 0; });
  superT = 0;
  const lvl = Math.random() < 0.25 ? 0 : 1 + ((Math.random() * 3) | 0);
  wind = WINDS[lvl] * (Math.random() < 0.5 ? -1 : 1);
  setBall(randomBall());
  resetCtl(); touches.clear();
  kickoff(); state = 'countdown'; cd = 3 * 60 + 30; particles.length = 0;
}
function toMenu() { closeNet(); state = 'menu'; aiSlots[0] = aiSlots[1] = null; me = 0; particles.length = 0; touches.clear(); pollLobby(); }
// Sur l'accueil, on demande au serveur toutes les 3 s si un joueur attend en ligne.
let lobby = null;
function pollLobby() {
  return fetch('api/lobby', { cache: 'no-store' }).then((r) => r.json()).then((j) => { lobby = j; }).catch(() => { lobby = null; });
}
setInterval(() => { if (state === 'menu' && !document.hidden) pollLobby(); }, 3000);
function toSelect() { state = 'select'; ready[0] = ready[1] = false; particles.length = 0; touches.clear(); }
function chooseMenu(k) {
  const m = MENU[k]; menuSel = k;
  mode = m.mode; if (m.mode === 'ai') aiLevel = m.lvl;
  sfx.tick(); toSelect();
}
function confirmSolo() {
  sfx.tick();
  if (mode === 'ai') {
    me = 0; aiSlots[0] = null; aiSlots[1] = aiLevel;
    pick[1] = BOSS; // l'IA joue toujours Le Boss
    startMatch();
  } else goOnline();
}
function afterEnd() {

  else toSelect();
}

// ---- menus : clavier ----
function uiKey(code) {
  const up = code === 'ArrowUp' || code === 'KeyW', down = code === 'ArrowDown' || code === 'KeyS';
  const left = code === 'ArrowLeft' || code === 'KeyA', right = code === 'ArrowRight' || code === 'KeyD';
  const ok = code === 'Enter' || code === 'Space' || code === 'NumpadEnter';
  if (code === 'Escape') { if (state !== 'menu') { sfx.tick(); toMenu(); } return; }
  if (state === 'menu') {
    if (up) { menuSel = (menuSel + MENU.length - 1) % MENU.length; sfx.tick(); }
    if (down) { menuSel = (menuSel + 1) % MENU.length; sfx.tick(); }
    if (ok) chooseMenu(menuSel);
  } else if (state === 'select') {
    if (mode === 'local') {
      for (const i of [0, 1]) {
        const m = KEYMAP[i];
        if (!ready[i] && m.left.includes(code)) { pick[i] = nextPick(pick[i], -1); sfx.tick(); }
        if (!ready[i] && m.right.includes(code)) { pick[i] = nextPick(pick[i], 1); sfx.tick(); }
        if (m.kick.includes(code) || m.jump.includes(code)) { ready[i] = !ready[i]; sfx.tick(); }
      }
      if (ready[0] && ready[1]) startMatch();
    } else {
      if (left) { pick[0] = nextPick(pick[0], -1); sfx.tick(); }
      if (right) { pick[0] = nextPick(pick[0], 1); sfx.tick(); }
      if (ok || up || down) confirmSolo();
    }
  } else if (state === 'end') {
    if (endT > 60 && (ok || KEYMAP.some((m) => m.kick.includes(code)))) afterEnd();
  }
}
// ---- menus : toucher / souris ----
// Plein écran au premier toucher sur téléphone (Android). Safari sur iPhone ne le permet pas aux pages web :
// là-bas il faut « Sur l'écran d'accueil » (le manifest ouvre alors le jeu sans barre du navigateur).
const IS_IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const IS_APP = navigator.standalone || matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches;
function goFullscreen() {
  if (!touchMode || document.fullscreenElement || !document.fullscreenEnabled) return;
  document.documentElement.requestFullscreen({ navigationUI: 'hide' })
    .then(() => screen.orientation?.lock?.('landscape'))
    .catch(() => { /* refusé par le navigateur : on joue sans */ });
}
function uiTap(pt) {
  goFullscreen();
  const inR = (r) => pt.x >= r.x && pt.x <= r.x + r.w && pt.y >= r.y && pt.y <= r.y + r.h;
  if (state === 'menu') {
    MENU.forEach((_, k) => { if (inR(pillRect(k))) chooseMenu(k); });
  } else if (state === 'select') {
    if (inR({ x: 0, y: 0, w: 150, h: 56 })) { sfx.tick(); toMenu(); return; }
    const j = PICKABLE.findIndex((_, jj) => Math.abs(pt.x - cardX(jj)) < 68 && pt.y > 160 && pt.y < 360);
    if (j < 0) return;
    const k = PICKABLE[j];
    if (mode === 'local') {
      const i = ready[0] ? 1 : 0;
      pick[i] = k; ready[i] = true; sfx.tick();
      if (ready[0] && ready[1]) startMatch();
    } else { pick[0] = k; confirmSolo(); }
  } else if (state === 'wait') { sfx.tick(); toMenu(); }
  else if (state === 'end' && endT > 60) afterEnd();
}

// ================= en ligne =================
// Le serveur met en relation deux joueurs puis relaie leurs messages. Le 1er arrivé (role 0, J1 rouge) fait tourner
// la partie et envoie l'état à chaque image ; l'invité (role 1, J2 bleu) envoie seulement ses commandes.
// ponytail: l'hôte fait autorité, l'invité a un aller-retour réseau de retard ; simuler côté serveur si c'est gênant.
let net = null;
function goOnline() {
  closeNet();
  const url = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + location.pathname.replace(/[^/]*$/, '') + 'ws';
  state = 'wait'; waitMsg = "Recherche d'un adversaire";
  let ws;
  try { ws = new WebSocket(url); } catch (e) { waitMsg = 'Connexion impossible'; return; }
  const n = net = { ws, role: -1, remote: { x: 0, j: false, k: 0, jc: 0 }, lastIn: '' };
  ws.onopen = () => ws.send(JSON.stringify({ t: 'find', head: pick[0] }));
  ws.onmessage = (ev) => { if (net === n) { try { onNet(JSON.parse(ev.data)); } catch (e) { /* message invalide */ } } };
  ws.onclose = () => {
    if (net !== n) return;
    net = null;
    if (state === 'wait') waitMsg = 'Serveur injoignable';
    else if (IN_MATCH.includes(state)) { endNote = 'Connexion perdue'; endMatch(); }
  };
  n.ping = setInterval(() => { if (ws.readyState === 1 && n.role < 0) ws.send('{"t":"ping"}'); }, 20000);
}
function closeNet() {
  if (!net) return;
  const n = net; net = null;
  clearInterval(n.ping);
  try { n.ws.close(); } catch (e) { /* déjà fermé */ }
}
function onNet(m) {
  if (m.t === 'start') {
    net.role = me = m.role === 1 ? 1 : 0;
    pick[0] = m.heads[0] | 0; pick[1] = m.heads[1] | 0;
    aiSlots[0] = aiSlots[1] = null;
    startMatch();
  } else if (m.t === 'in' && net.role === 0) net.remote = m;
  else if (m.t === 's' && net.role === 1) applySnap(m);
  else if (m.t === 'left') {
    closeNet();
    if (state !== 'end') { endNote = 'Ton adversaire est parti'; endMatch(); }
  }
}
const r1 = (v) => Math.round(v * 10) / 10;
function snapshot() {
  return {
    t: 's', st: state, sc: score, tl: r1(timeLeft), cd, gt: goalT, ls: lastScorer, en: endNote,
    b: [r1(ball.x), r1(ball.y), r1(ball.rot)],
    p: players.map((p) => [r1(p.x), r1(p.y), r1(p.vx), r1(p.vy), p.kickT, p.onGround ? 1 : 0]),
    pw: players.map((p) => Math.round(p.power)), bf: ball.fire > 0 ? 1 : 0, bb: ball.fireBy, wd: wind, bt: ball.type,
    pop: pop.t > 0 ? [pop.text, Math.round(pop.x), Math.round(pop.y), pop.t] : null,
    ev: events.splice(0),
  };
}
function applySnap(m) {
  const prev = state;
  state = m.st; score[0] = m.sc[0]; score[1] = m.sc[1]; timeLeft = m.tl; cd = m.cd; goalT = m.gt; lastScorer = m.ls; endNote = m.en;
  [ball.x, ball.y, ball.rot] = m.b;
  m.p.forEach((a, i) => { const p = players[i]; [p.x, p.y, p.vx, p.vy, p.kickT] = a; p.onGround = !!a[5]; p.power = m.pw ? m.pw[i] : 0; });
  if (m.bf && !ball.fire) { superT = 60; ball.fireBy = m.bb; shake = 10; }
  ball.fire = m.bf ? 1 : 0;
  wind = m.wd || 0;
  if (m.bt && m.bt !== ball.type) setBall(m.bt);
  if (m.pop) [pop.text, pop.x, pop.y, pop.t] = m.pop; else pop.t = 0;
  m.ev.forEach((name) => sfx[name] && sfx[name]());
  if (state === 'goal' && prev !== 'goal') confetti(lastScorer);
  if (state === 'end' && prev !== 'end') { endT = 0; endConfetti(); }
}

// angle de la jambe : repos 0.3 rad, monte à 2.0 rad (pied devant et en l'air), redescend
function kickAngle(t) {
  if (t === 0) return 0.3;
  if (t <= 6) return 0.3 + 1.7 * t / 6;
  if (t <= 10) return 2.0;
  return 2.0 - 1.7 * (t - 10) / 6;
}
function footPos(p) {
  const a = kickAngle(p.kickT);
  return { x: p.x - p.f * 4 + p.f * 20 * Math.sin(a), y: p.y + R + 20 * Math.cos(a) - 2, a };
}

// ================= physique =================
function updatePlayer(p) {
  const c = ctl[p.i];
  if (p.touchCd > 0) p.touchCd--;
  p.vx = c.x * SPEED;
  if ((c.jump || c.jumpQ > 0) && p.onGround) { p.vy = JUMP; p.onGround = false; c.jumpQ = 0; play('jump'); }
  if (c.kickQ > 0 && p.kickT === 0) { p.kickT = 1; c.kickQ = 0; }
  else if (p.kickT > 0 && ++p.kickT > KICK_LEN) p.kickT = 0;
  if (c.kickQ > 0) c.kickQ--;
  if (c.jumpQ > 0) c.jumpQ--;

  const prevFeet = p.y + R + 31;
  p.vy += GRAV; p.x += p.vx; p.y += p.vy;
  p.onGround = false;
  if (p.y >= REST_Y) { p.y = REST_Y; p.vy = 0; p.onGround = true; }
  // barres transversales : on peut se poser dessus, et on s'y cogne la tête
  for (const [x0, y0, x1, y1] of BARS) {
    const feet = p.y + R + 31;
    if (p.vy >= 0 && p.x + 12 > x0 && p.x - 12 < x1 && prevFeet <= y0 + 1 && feet >= y0) {
      p.y = y0 - R - 31; p.vy = 0; p.onGround = true;
    }
    const cx = clamp(p.x, x0, x1), cy = clamp(p.y, y0, y1), dx = p.x - cx, dy = p.y - cy, d = Math.hypot(dx, dy);
    if (d < R && d > 0) {
      p.x = cx + dx / d * R; p.y = cy + dy / d * R;
      if (dy > 0 && p.vy < 0) p.vy = 0;
    }
  }
  p.x = clamp(p.x, R * 0.8, W - R * 0.8);
}

function playerVsPlayer() {
  const [a, b] = players, dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 0.01, min = 2 * R;
  if (d >= min) return;
  const nx = dx / d, ny = dy / d, push = (min - d) / 2;
  a.x -= nx * push; a.y -= ny * push; b.x += nx * push; b.y += ny * push;
  // l'un peut atterrir sur la tête de l'autre
  if (Math.abs(ny) > 0.6) {
    const top = ny > 0 ? a : b;
    if (top.vy > 0) { top.vy = 0; top.onGround = true; }
  }
  [a, b].forEach((p) => { if (p.y > REST_Y) p.y = REST_Y; p.x = clamp(p.x, R * 0.8, W - R * 0.8); });
}

// renvoie true si la balle touche le cercle (cx, cy, cr) qui se déplace à (cvx, cvy)
function bounceCircle(cx, cy, cr, cvx, cvy, rest) {
  const dx = ball.x - cx, dy = ball.y - cy, d = Math.hypot(dx, dy), min = cr + ball.r;
  if (d >= min) return false;
  const nx = d ? dx / d : 0, ny = d ? dy / d : -1;
  ball.x = cx + nx * min; ball.y = cy + ny * min;
  const vn = (ball.vx - cvx) * nx + (ball.vy - cvy) * ny;
  if (vn < 0) { ball.vx -= (1 + rest) * vn * nx; ball.vy -= (1 + rest) * vn * ny; }
  return true;
}
function bouncePost(px) {
  // segment vertical du haut du poteau (de la barre jusqu'à POST_LEN px dessous), arrondi : la balle rebondit dessus
  const cy = clamp(ball.y, BAR_Y + BAR_H / 2, BAR_Y + BAR_H + POST_LEN);
  const dx = ball.x - px, dy = ball.y - cy, d = Math.hypot(dx, dy), min = POST_R + ball.r;
  if (d >= min) return;
  const nx = d ? dx / d : (px < W / 2 ? 1 : -1), ny = d ? dy / d : 0;
  ball.x = px + nx * min; ball.y = cy + ny * min;
  const vn = ball.vx * nx + ball.vy * ny;
  if (vn < 0) {
    const k = 1 + Math.min(0.98, POST_BOUNCE * BT().wall);
    ball.vx -= k * vn * nx; ball.vy -= k * vn * ny; ball.spin *= -0.6;
    if (vn < -3) { play('post'); showPop('POTEAU !'); shake = Math.max(shake, 5); }
  }
}
function bounceRect(x0, y0, x1, y1) {
  const cx = clamp(ball.x, x0, x1), cy = clamp(ball.y, y0, y1), dx = ball.x - cx, dy = ball.y - cy, d = Math.hypot(dx, dy);
  if (d >= ball.r) return;
  const nx = d ? dx / d : 0, ny = d ? dy / d : -1;
  ball.x = cx + nx * ball.r; ball.y = cy + ny * ball.r;
  const vn = ball.vx * nx + ball.vy * ny;
  if (vn < 0) {
    const k = 1 + 0.6 * BT().wall;
    ball.vx -= k * vn * nx; ball.vy -= k * vn * ny; ball.spin *= 0.7;
    if (vn < -2) play('bounce');
    if (vn < -7) showPop('BARRE !');
  }
  // posée sur la barre : elle roule vers le terrain au lieu de rester coincée
  if (ny < -0.5) ball.vx += x0 === 0 ? 0.25 : -0.25;
}

const hasFire = (p) => !!HEADS[p.head].fire;
function gainPower(p, amount) {
  if (p.touchCd > 0 || !hasFire(p)) return;
  p.power = Math.min(100, p.power + amount); p.touchCd = 12;
}
function superShot(p) {
  const tx = p.f === 1 ? W - 25 : 25, ty = GROUND - 70; // fond du but adverse, sous la barre
  const dx = tx - ball.x, dy = ty - ball.y, d = Math.hypot(dx, dy) || 1;
  ball.vx = dx / d * FIRE_SPEED; ball.vy = dy / d * FIRE_SPEED;
  ball.fire = 120; ball.fireBy = p.i; p.power = 0; p.touchCd = 20;
  if (p.kickT) p.kickT = 11;
  superT = 60; shake = 10; play('fire');
}
function checkGoal() {
  if (state !== 'play') return;
  if (ball.x + ball.r < GOAL_W && ball.y > BAR_Y + BAR_H) goal(1);
  else if (ball.x - ball.r > W - GOAL_W && ball.y > BAR_Y + BAR_H) goal(0);
}

function updateBall() {
  // balle en feu : ligne droite, sans gravité, elle traverse les joueurs ; s'éteint sur un mur, le sol ou une barre
  if (ball.fire > 0) {
    ball.fire--;
    ball.x += ball.vx; ball.y += ball.vy; ball.rot += ball.vx / ball.r;
    const hit = ball.x < ball.r || ball.x > W - ball.r || ball.y > GROUND - ball.r || ball.y < ball.r
      || BARS.some(([x0, y0, x1, y1]) => ball.x + ball.r > x0 && ball.x - ball.r < x1 && ball.y + ball.r > y0 && ball.y - ball.r < y1);
    // (la balle en feu vise le bas du but : elle ne touche jamais le haut du poteau)
    checkGoal();
    if (!hit && ball.fire > 0) return;
    ball.fire = 0; ball.vx *= 0.5; ball.vy *= 0.5;
  }
  const onGround = ball.y >= GROUND - ball.r - 0.5;
  // effet Magnus : la vitesse est déviée à 90° proportionnellement à l'effet (brossé = plonge, rétro = flotte)
  if (!onGround) { ball.vx += -MAGNUS * ball.spin * ball.vy; ball.vy += MAGNUS * ball.spin * ball.vx; }
  const bt = BT();
  if (!onGround) { ball.vx += wind * bt.wind * (1 + 0.4 * Math.sin(frame / 45)); ball.vy *= bt.drag; } // vent (rafales), freinage de l'air
  ball.vy += bt.grav; ball.vx *= bt.drag; ball.spin *= SPIN_DECAY;
  ball.x += ball.vx; ball.y += ball.vy;
  ball.rot += onGround ? ball.vx / ball.r : ball.spin;
  if (ball.y > GROUND - ball.r) {
    ball.y = GROUND - ball.r;
    if (ball.vy > 2) play('bounce');
    // au rebond, l'effet « mord » le sol : brossé → la balle repart vers l'avant, rétro → elle freine / revient
    ball.vx += ball.spin * ball.r * 0.25; ball.spin *= 0.5;
    ball.vy = Math.abs(ball.vy) < 1.2 ? 0 : -ball.vy * (bt.bounce - 0.05 + Math.random() * 0.1);
    ball.vx *= 0.985;
  }
  if (ball.y < ball.r) { ball.y = ball.r; ball.vy = Math.abs(ball.vy) * 0.7; }
  if (ball.x < ball.r) { ball.x = ball.r; ball.vx = Math.abs(ball.vx) * 0.7; ball.spin *= -0.5; }
  if (ball.x > W - ball.r) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx) * 0.7; ball.spin *= -0.5; }
  POSTS.forEach(bouncePost);
  BARS.forEach((b) => bounceRect(...b));

  for (const p of players) {
    if (ball.fire) break; // la balle en feu traverse tout le monde
    if (bounceCircle(p.x, p.y, R, p.vx, p.vy, BT().head)) {
      if (p.power >= 100 && hasFire(p)) { superShot(p); continue; } // super tête
      if (Math.hypot(ball.vx, ball.vy) > 4) play('head');
      ball.spin = clamp(ball.spin * 0.3 + (ball.x - p.x) / R * 0.12 * Math.sign(ball.vy || 1), -0.3, 0.3); // touche de côté = effet
      if (p.vy < -6 && ball.y < p.y - R * 0.5) { ball.vx += p.f * 3; showPop('TÊTE !'); } // tête en pleine extension : plus de punch vers l'avant
      gainPower(p, POWER_HEAD);
    }
    const ft = footPos(p);
    const kicking = p.kickT >= 1 && p.kickT <= 10;
    const foot = bounceCircle(ft.x, ft.y, FOOT_R, p.vx, p.vy, 0.5);
    if (foot && !kicking) gainPower(p, POWER_TOUCH);
    if (foot && kicking && p.power >= 100 && hasFire(p)) { superShot(p); continue; } // super tir
    if (foot && kicking) {
      const shot = SHOTS[shotType(p)];
      // bon timing (pied qui monte, images 1 à 5) = pleine puissance ; balle frappée en fin de geste = tir plus mou
      const timing = p.kickT <= 5 ? 1 : p.kickT <= 7 ? 0.88 : 0.72;
      const power = shot.power * timing * BT().kick * (0.95 + Math.random() * 0.1);
      // angle : vers l'avant et vers le haut selon le type, corrigé par l'endroit où le pied touche la balle, + un peu de hasard
      const hit = clamp((ft.y - ball.y) / (FOOT_R + ball.r), -1, 1) * 0.25; // pied sous la balle = plus haut
      const a = shot.lift + hit + (Math.random() - 0.5) * 0.12;
      ball.vx = p.f * Math.cos(a) * power + (p.vx * p.f > 0 ? p.vx * 0.4 : 0); ball.vy = -Math.sin(a) * power; // l'élan ne compte qu'en avançant
      ball.spin = p.f * shot.spin;
      if (shot.label) showPop(shot.label);
      p.kickT = 11; // la jambe redescend, un seul tir par coup de pied
      play('kick'); shake = Math.max(shake, 3);
      p.touchCd = 0; gainPower(p, POWER_KICK);
    }
  }
  const sp = Math.hypot(ball.vx, ball.vy);
  if (sp > BALL_MAX) { ball.vx *= BALL_MAX / sp; ball.vy *= BALL_MAX / sp; }
  checkGoal();
}

function shotType(p) {
  const run = ctl[p.i].x * p.f; // > 0 : court vers le but adverse, < 0 : recule
  if (!p.onGround) return 'volee';
  if (run < -0.3) return 'lob';
  if (run > 0.3 && ball.y > GROUND - 60) return 'missile';
  return 'normal';
}
function showPop(text) { Object.assign(pop, { text, x: ball.x, y: ball.y - 30, t: 45 }); }

const CONFETTI = ['#ffd93d', '#ff3b3b', '#2f7bff', '#3ddc84', '#ffffff', '#ff7ad9'];
function confetti(scorer) {
  shake = 14;
  const gx = scorer === 0 ? W - GOAL_W / 2 : GOAL_W / 2;
  for (let i = 0; i < 90; i++) {
    particles.push({ x: gx, y: BAR_Y + 60, vx: (Math.random() - 0.5) * 12, vy: -Math.random() * 12 - 2, life: 90 + Math.random() * 40,
      c: CONFETTI[i % 6], s: 4 + Math.random() * 5, rot: Math.random() * 6 });
  }
}
function endConfetti() {
  if (score[0] === score[1]) return;
  for (let i = 0; i < 160; i++) {
    particles.push({ x: Math.random() * W, y: -20 - Math.random() * 300, vx: (Math.random() - 0.5) * 3, vy: Math.random() * 2 + 1, life: 400,
      c: CONFETTI[i % 6], s: 4 + Math.random() * 5, rot: Math.random() * 6 });
  }
}
function goal(scorer) {
  score[scorer]++; lastScorer = scorer; state = 'goal'; goalT = 110;
  play('goal'); confetti(scorer);
}
function endMatch() {
  state = 'end'; endT = 0; play('final'); endConfetti();
}

function step() {
  frame++;
  if (net && net.role === 1) guestStep();
  else if (state === 'countdown') {
    gatherInputs();
    if (cd % 60 === 30 && cd > 30) play('tick');
    if (--cd <= 0) { state = 'play'; play('whistle'); }
  } else if (state === 'play' || state === 'goal') {
    if (state === 'play') {
      timeLeft -= 1 / 60;
      if (timeLeft <= 0) { timeLeft = 0; endMatch(); }
    } else if (--goalT <= 0) { kickoff(); state = 'play'; }
    if (state !== 'end') {
      ballHist.push({ x: ball.x, y: ball.y, vx: ball.vx, vy: ball.vy });
      if (ballHist.length > 40) ballHist.shift();
      gatherInputs();
      players.forEach(updatePlayer);
      playerVsPlayer();
      updateBall();
    }
  } else if (state === 'end') endT++;
  if (net && net.role === 0 && net.ws.readyState === 1 && (IN_MATCH.includes(state) || (state === 'end' && endT < 3))) net.ws.send(JSON.stringify(snapshot()));
  stepFx();
}
// invité en ligne : pas de simulation, il envoie ses commandes et affiche l'état reçu de l'hôte
function guestStep() {
  if (state === 'end') endT++;
  if (!IN_MATCH.includes(state)) return;
  gatherInputs();
  const c = ctl[1];
  const s = JSON.stringify({ t: 'in', x: Math.round(c.x * 100) / 100, j: c.jump, k: c.sentK, jc: c.sentJ });
  if ((s !== net.lastIn || frame % 30 === 0) && net.ws.readyState === 1) { net.ws.send(s); net.lastIn = s; }
  c.kickQ = c.jumpQ = 0;
}
const FIRE = ['#fff3b0', '#ffd93d', '#ff9f1c', '#ff5b1c', '#e0241b'];
function flame(x, y, vx, vy, s) {
  particles.push({ x, y, vx, vy, life: 16 + Math.random() * 12, c: FIRE[(Math.random() * FIRE.length) | 0], s, rot: 0, g: -0.06, fire: true });
}
function stepFx() {
  if (superT > 0) superT--;
  if (pop.t > 0) { pop.t--; pop.y -= 0.6; }
  if (wind && IN_MATCH.includes(state) && frame % Math.round(10 - Math.abs(wind) * 120) === 0) {
    const sx = Math.sign(wind);

    outlinedText('J2 :  ← / → choisir  •  ↓ ou ↑ : prêt', W / 2 + 230, 400, COLORS[1].main, 5);
    ctx.font = font(15);
    outlinedText('En match — J1 : Q D bouger, Z sauter, S ou Espace tirer   |   J2 : ← → bouger, ↑ sauter, ↓ ou Entrée tirer', W / 2, 436, '#fff', 4);
  } else {
    outlinedText('← → choisir  •  Entrée : jouer', W / 2, 400, '#ffd93d', 5);
    ctx.font = font(15);
    outlinedText('En match : ← → ou Q D bouger, ↑ ou Z sauter, Espace ou ↓ tirer', W / 2, 436, '#fff', 4);
  }
}
function drawWait() {
  dim(); drawTitle();
  const dots = '.'.repeat(1 + ((frame / 20) | 0) % 3);
  ctx.font = font(32); outlinedText(waitMsg + (waitMsg.startsWith('Recherche') ? dots : ''), W / 2, 170, '#ff7ad9', 7);
  drawHead(HEADS[pick[0]], W / 2, 290 + Math.sin(frame / 10) * 8, 1, 150, Math.sin(frame / 16) * 0.12);
  ctx.font = font(18);
  outlinedText(touchMode ? 'Touche l’écran pour annuler' : 'Échap pour annuler', W / 2, 420, '#fff', 5);
  outlinedText('Ton pote ouvre le jeu et choisit EN LIGNE : la partie démarre toute seule', W / 2, 455, '#ffd93d', 5);
}

function render() {
  ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
  ctx.imageSmoothingQuality = 'high';
  ctx.save();
  if (shake) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  ctx.drawImage(bg, 0, 0, W, H);
  drawNet(true); drawNet(false);
  const inGame = IN_MATCH.includes(state) || state === 'end';
  if (inGame) {
    players.forEach((p) => shadow(p.x, p.y + R + 31));
    shadow(ball.x, ball.y + ball.r);
    players.forEach(drawPlayer);
    drawBall();
  }
  drawGoalFrame(true); drawGoalFrame(false);
  for (const q of particles) {
    if (q.wind) { ctx.globalAlpha = 0.35; ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(q.x, q.y); ctx.lineTo(q.x - Math.sign(q.vx) * q.s, q.y); ctx.stroke(); ctx.globalAlpha = 1; continue; }
    if (q.fire) { ctx.globalAlpha = Math.min(1, q.life / 16); ctx.fillStyle = q.c; ctx.beginPath(); ctx.arc(q.x, q.y, q.s * (0.4 + q.life / 40), 0, 7); ctx.fill(); ctx.globalAlpha = 1; continue; }
    ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.rot); ctx.fillStyle = q.c; ctx.fillRect(-q.s / 2, -q.s / 4, q.s, q.s / 2); ctx.restore();
  }
  ctx.restore();

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (state === 'menu') drawMenu();
  else if (state === 'select') drawSelect();
  else if (state === 'wait') drawWait();
  else drawHud();
  if (state === 'countdown') {
    drawTouchHelp();
    const n = Math.ceil((cd - 30) / 60);
    ctx.font = font(n > 0 ? 120 : 100);
    outlinedText(n > 0 ? String(n) : 'GO !', W / 2, H / 2 - 50, '#ffd93d', 12);
    if (ball.type !== 'classique') { ctx.font = font(34); outlinedText('⚽ ' + BT().name + ' !', W / 2, H / 2 + 40, '#ff7ad9', 8); }
  }
  if (state === 'goal') {
    const k = Math.min(1, (110 - goalT) / 12);
    ctx.save(); ctx.translate(W / 2, H / 2 - 40); ctx.scale(k * (1 + Math.sin(frame / 5) * 0.04), k); ctx.rotate(-0.06);
    ctx.font = font(110); outlinedText('BUUUT !', 0, 0, COLORS[lastScorer].main, 14);
    ctx.font = font(30); outlinedText(HEADS[players[lastScorer].head].name, 0, 70, '#fff', 7);
    ctx.restore();
  }
  if (pop.t > 0 && IN_MATCH.includes(state)) {
    ctx.globalAlpha = Math.min(1, pop.t / 12); ctx.font = font(26);
    outlinedText(pop.text, clamp(pop.x, 90, W - 90), clamp(pop.y, 130, H - 40), '#ffd93d', 6); ctx.globalAlpha = 1;
  }
  if (superT > 0 && state === 'play') {
    const k = Math.min(1, (60 - superT) / 8);
    ctx.save(); ctx.translate(W / 2, 170); ctx.scale(k, k); ctx.rotate(-0.05);
    ctx.font = font(64); outlinedText('🔥 SUPER TIR !', 0, 0, '#ff9f1c', 10);
    ctx.restore();
  }
  if (IN_MATCH.includes(state)) drawTouches();
  if (state === 'end') {
    ctx.fillStyle = 'rgba(20,24,50,0.6)'; ctx.fillRect(0, 0, W, H);
    const win = score[0] === score[1] ? -1 : score[0] > score[1] ? 0 : 1;
    ctx.font = font(76);
    if (win < 0) {
      outlinedText('ÉGALITÉ !', W / 2, 150, '#ffd93d', 12);
      drawHead(HEADS[players[0].head], W / 2 - 110, 290, 1, 150);
      drawHead(HEADS[players[1].head], W / 2 + 110, 290, -1, 150);
    } else {
      const title = mode === 'local' ? 'VICTOIRE !' : win === me ? 'GAGNÉ !' : 'PERDU !';
      outlinedText(title, W / 2, 140, COLORS[win].main, 12);
      drawHead(HEADS[players[win].head], W / 2, 290 + Math.sin(frame / 8) * 8, 1, 190, Math.sin(frame / 12) * 0.1);
      ctx.font = font(36); outlinedText(HEADS[players[win].head].name, W / 2, 410, '#fff', 8);
    }
    ctx.font = font(44); outlinedText(score[0] + ' - ' + score[1], W / 2, 210, '#fff', 8);
    if (endNote) { ctx.font = font(24); outlinedText(endNote, W / 2, 60, '#ff7ad9', 6); }
    if (endT > 60) { ctx.font = font(20); outlinedText(touchMode ? 'Touche l’écran pour rejouer' : 'Entrée pour rejouer · Échap : menu', W / 2, 455, '#ffd93d', 5); }
  }
}

// ================= boucle =================
fitCanvas(); drawBackground();
document.fonts?.load(font(20)).then(drawBackground).catch(() => {});
let acc = 0, last = performance.now();
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) { step(); acc -= 1000 / 60; }
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

if (DEBUG) {
  window.__hb = {
    consts: { W, H, GROUND, R, FOOT_R, REST_Y, GOAL_W, BAR_Y, BAR_H, BALL_R, MATCH_TIME, KICK_LEN, STICK, SWIPE_UP },
    heads: HEADS, pickable: PICKABLE, boss: BOSS, menu: MENU, aiLevels: AI_LEVELS,
    // start(a, b, { mode, ai: [niveau J1, niveau J2] }) : match direct, compte à rebours sauté
    start(a = 0, b = 3, o = {}) {
      toMenu(); mode = o.mode || 'local'; pick[0] = a; pick[1] = b;
      aiSlots[0] = o.ai ? o.ai[0] : null; aiSlots[1] = o.ai ? o.ai[1] : null;
      if (aiSlots[1] !== null) aiLevel = aiSlots[1];
      startMatch(); wind = o.wind || 0; setBall(o.ball || 'classique'); cd = 1; step(); // vent nul et ballon classique par défaut : tests reproductibles
    },
    toMenu, toSelect, chooseMenu, key: uiKey, tap: (x, y) => uiTap({ x, y }),
    run(n = 1) { for (let i = 0; i < n; i++) step(); },
    press(p, k) { dbgHeld.add(p + ':' + k); }, release(p, k) { dbgHeld.delete(p + ':' + k); },
    releaseAll() { dbgHeld.clear(); },
    info: () => ({ state, mode, aiLevel, aiSlots: [...aiSlots], me, score: [...score], timeLeft, pick: [...pick], ready: [...ready], touchMode, endNote, waitMsg,
      net: net ? { role: net.role, ready: net.ws.readyState } : null }),
    ball: () => ball, players: () => players, ctl: () => ctl, footPos, touches: () => [...touches.values()],
    pollLobby, lobby: () => lobby, pop: () => pop, shots: SHOTS, winds: WINDS, wind: () => wind, setWind(v) { wind = v; }, balls: BALLS, setBall,
    setTime(s) { timeLeft = s; }, setPower(i, v) { players[i].power = v; }, setTouchMode(b) { touchMode = b; }, render,
  };
}
</script>
